[package]
name = "handout"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Share agent-generated files with recipients via links. REST + MCP + OAuth, SQLite, single binary."
license = "MIT"

[dependencies]
anyhow = "1"
argon2 = { version = "0.6", features = ["getrandom"] }
axum = { version = "0.8", features = ["multipart", "macros", "form", "query", "json"] }
axum-extra = { version = "0.12", features = ["cookie", "typed-header"] }
base64 = "0.23"
bs58 = "0.5"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
hmac = "0.13"
http = "1"
mime_guess = "2"
pulldown-cmark = "0.13"
rand = "0.10"
rmcp = { version = "3.9", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
rpassword = "7"
rust-embed = { version = "8", features = ["include-exclude"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "derive", "time", "uuid"] }
subtle = "2"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros", "serde-well-known"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "set-header", "limit", "normalize-path"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "cookies", "form", "query"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
