name: release

# Every push to main is a release: build, test, package, publish. Tags are `<yyyymmdd>-<sha7>`, so
# `handout-update` (latest) and `handout-update <tag>` (rollback) keep working. Only the default
# branch builds, which is also where the cargo/npm caches are saved and restored.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# An older commit must never become "latest" after a newer one: one release at a time, newest wins.
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web
        working-directory: web
        run: npm ci && npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools

      - run: cargo test --locked
      - run: cargo build --release --locked --target "$TARGET"

      - name: Package
        run: |
          name=handout-x86_64-linux-musl
          cp "target/$TARGET/release/handout" "$name"
          sha256sum "$name" > "$name.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists (re-run on the same commit)"
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes \
            handout-x86_64-linux-musl handout-x86_64-linux-musl.sha256
