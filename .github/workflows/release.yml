name: release

on:
  push:
    # main builds keep the cargo/npm caches on the default branch, where tag builds can restore them
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web
        working-directory: web
        run: npm ci && npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools

      - run: cargo test --locked
      - run: cargo build --release --locked --target "$TARGET"

      - name: Package
        run: |
          name=handout-x86_64-linux-musl
          cp "target/$TARGET/release/handout" "$name"
          sha256sum "$name" > "$name.sha256"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes handout-x86_64-linux-musl handout-x86_64-linux-musl.sha256

      - uses: actions/upload-artifact@v5
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: handout-x86_64-linux-musl
          path: handout-x86_64-linux-musl*
